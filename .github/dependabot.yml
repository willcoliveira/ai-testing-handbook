# Monthly. Minor and patch updates come as one grouped PR per ecosystem; a major update comes as
# its own PR so a breaking change does not block the safe ones.
# Not grouped, because each needs a follow-up commit in the same PR before CI can pass:
# - @playwright/test: bump the image tag in tests/site/Dockerfile (the lint job checks it) and
#   regenerate the visual baselines (MAINTAINING.md, "## Site").
# - wico-playwright-agent-skills: run `npm run skills:sync` and commit .claude/skills/playwright-e2e
#   (`skills:check` fails until then).
# The docker ecosystem watches the digest pinned in tests/site/Dockerfile. Version updates of the
# tag are ignored on purpose: the tag must equal @playwright/test (the lint job checks it) and moves
# with that package, by hand; only digest updates for the pinned tag are wanted. Confirm on the first
# run that digest updates still arrive with the ignore in place; drop the ignore if they never do.
version: 2
updates:
  - package-ecosystem: docker
    directory: /tests/site
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "mcr.microsoft.com/playwright"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["@playwright/test", "wico-playwright-agent-skills"]
        update-types: ["minor", "patch"]
    ignore:
      # the site runs on Node 22 (.nvmrc); newer typings would allow APIs Node 22 lacks
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports typescript < 6.1; lift this when it supports 7
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
