name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Forbidden strings (example list only in CI)
        run: node scripts/check-forbidden.mjs
        env:
          CI: "1"
      - name: Sources, templates and taxonomy
        run: node scripts/check-sources.mjs
      - name: Links (report only)
        run: node scripts/check-links.mjs --report-only
